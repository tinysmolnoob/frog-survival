<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Frog Survival</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1d3b1a; font-family: "Trebuchet MS", sans-serif; }
  canvas { display: block; touch-action: none; }
  #overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(10, 30, 10, 0.75); color: #eaffd0; text-align: center; padding: 20px;
  }
  #overlay h1 { font-size: clamp(36px, 8vw, 72px); margin: 0 0 10px; color: #9be35a; text-shadow: 3px 3px 0 #1d3b1a; }
  #overlay p { font-size: 18px; max-width: 520px; line-height: 1.5; margin: 6px 0; }
  #overlay button {
    margin-top: 20px; font-size: 24px; padding: 12px 36px; border: none; border-radius: 30px;
    background: #9be35a; color: #1d3b1a; font-weight: bold; cursor: pointer; box-shadow: 0 5px 0 #4d8a25;
  }
  #overlay button:active { transform: translateY(3px); box-shadow: 0 2px 0 #4d8a25; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="overlay">
  <h1>🐸 Frog Survival</h1>
  <p>You are the frog. Survive the snakes, herons and hawks for as long as you can!</p>
  <p><b>Move:</b> WASD / arrow keys (or drag on touch)<br>
     <b>Leap:</b> Space (or double-tap) &mdash; you can't be caught mid-air<br>
     Eat 🪰 flies to stay fed. If your belly empties, you lose a heart.</p>
  <p id="result"></p>
  <button id="start">Play</button>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const resultEl = document.getElementById('result');
const startBtn = document.getElementById('start');

let W, H;
function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
addEventListener('resize', resize);
resize();

const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') { e.preventDefault(); if (running) leap(); }
});
addEventListener('keyup', e => { keys[e.code] = false; });

// Touch: drag to steer, double-tap to leap
let touchTarget = null, lastTap = 0;
canvas.addEventListener('pointerdown', e => {
  touchTarget = { x: e.clientX, y: e.clientY };
  const now = performance.now();
  if (now - lastTap < 300 && running) leap();
  lastTap = now;
});
canvas.addEventListener('pointermove', e => { if (touchTarget) touchTarget = { x: e.clientX, y: e.clientY }; });
addEventListener('pointerup', () => { touchTarget = null; });

let frog, flies, enemies, particles, lilies, time, score, best, running, spawnTimer, flyTimer, shake;
best = +localStorage.getItem('frogBest') || 0;

function reset() {
  frog = { x: W / 2, y: H / 2, r: 18, vx: 0, vy: 0, dir: 0, hearts: 3, belly: 100,
           air: 0, leapCd: 0, hurt: 0, hop: 0, faceX: 1, faceY: 0 };
  flies = []; enemies = []; particles = [];
  lilies = Array.from({ length: Math.round(W * H / 45000) }, () => ({
    x: Math.random() * W, y: Math.random() * H, r: 25 + Math.random() * 25, a: Math.random() * 6.28 }));
  time = 0; score = 0; spawnTimer = 2; flyTimer = 0; shake = 0;
  for (let i = 0; i < 5; i++) spawnFly();
}

function leap() {
  if (frog.leapCd > 0 || frog.air > 0) return;
  frog.air = 0.55; frog.leapCd = 1.4;
  const len = Math.hypot(frog.faceX, frog.faceY) || 1;
  frog.vx = frog.faceX / len * 520; frog.vy = frog.faceY / len * 520;
  puff(frog.x, frog.y, '#cfe8a8', 8);
}

function spawnFly() {
  flies.push({ x: 40 + Math.random() * (W - 80), y: 40 + Math.random() * (H - 80), t: Math.random() * 10 });
}

function edgePoint() {
  const s = Math.floor(Math.random() * 4);
  if (s === 0) return { x: -40, y: Math.random() * H };
  if (s === 1) return { x: W + 40, y: Math.random() * H };
  if (s === 2) return { x: Math.random() * W, y: -40 };
  return { x: Math.random() * W, y: H + 40 };
}

function spawnEnemy() {
  const roll = Math.random();
  const lvl = Math.min(time / 60, 2);
  if (roll < 0.45) {
    const p = edgePoint();
    enemies.push({ type: 'snake', x: p.x, y: p.y, speed: 90 + lvl * 50 + Math.random() * 30,
                   trail: [], life: 14 + Math.random() * 6, a: 0 });
  } else if (roll < 0.8) {
    // Heron: shadow aims near the frog, then strikes
    enemies.push({ type: 'heron', x: frog.x + (Math.random() - 0.5) * 80, y: frog.y + (Math.random() - 0.5) * 80,
                   t: 0, warn: Math.max(0.8, 1.6 - lvl * 0.35), struck: false });
  } else {
    // Hawk: dives across the screen in a line after a warning
    const p = edgePoint();
    const ang = Math.atan2(frog.y - p.y, frog.x - p.x);
    enemies.push({ type: 'hawk', x: p.x, y: p.y, ang, t: 0, warn: 1.1, speed: 700 + lvl * 150 });
  }
}

function puff(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.28, s = 40 + Math.random() * 120;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5, color });
  }
}

function hurt() {
  if (frog.hurt > 0 || frog.air > 0) return;
  frog.hearts--; frog.hurt = 1.5; shake = 0.4;
  puff(frog.x, frog.y, '#ff6b6b', 16);
  if (frog.hearts <= 0) gameOver();
}

function gameOver() {
  running = false;
  const final = Math.floor(score);
  if (final > best) { best = final; localStorage.setItem('frogBest', best); }
  resultEl.innerHTML = `You survived <b>${time.toFixed(1)}s</b> &mdash; score <b>${final}</b><br>Best: ${best}`;
  startBtn.textContent = 'Play again';
  overlay.classList.remove('hidden');
}

function update(dt) {
  time += dt; score += dt * 10;
  frog.leapCd = Math.max(0, frog.leapCd - dt);
  frog.hurt = Math.max(0, frog.hurt - dt);
  shake = Math.max(0, shake - dt);

  // Movement
  let mx = 0, my = 0;
  if (keys.KeyA || keys.ArrowLeft) mx--;
  if (keys.KeyD || keys.ArrowRight) mx++;
  if (keys.KeyW || keys.ArrowUp) my--;
  if (keys.KeyS || keys.ArrowDown) my++;
  if (touchTarget) {
    const dx = touchTarget.x - frog.x, dy = touchTarget.y - frog.y, d = Math.hypot(dx, dy);
    if (d > 15) { mx = dx / d; my = dy / d; }
  }
  if (mx || my) { frog.faceX = mx; frog.faceY = my; }

  if (frog.air > 0) {
    frog.air -= dt;
    frog.x += frog.vx * dt; frog.y += frog.vy * dt;
  } else {
    const len = Math.hypot(mx, my) || 1;
    frog.x += mx / len * 220 * dt; frog.y += my / len * 220 * dt;
    if (mx || my) frog.hop += dt * 12;
  }
  frog.x = Math.max(frog.r, Math.min(W - frog.r, frog.x));
  frog.y = Math.max(frog.r, Math.min(H - frog.r, frog.y));
  frog.dir = Math.atan2(frog.faceY, frog.faceX);

  // Hunger
  frog.belly -= dt * (5 + time / 40);
  if (frog.belly <= 0) { frog.belly = 60; frog.hurt = 0; hurt(); }

  // Flies
  flyTimer -= dt;
  if (flyTimer <= 0 && flies.length < 8) { spawnFly(); flyTimer = 1.2; }
  for (const f of flies) {
    f.t += dt;
    f.x += Math.cos(f.t * 3) * 40 * dt; f.y += Math.sin(f.t * 4.3) * 40 * dt;
  }
  flies = flies.filter(f => {
    if (Math.hypot(f.x - frog.x, f.y - frog.y) < frog.r + 22) {
      frog.belly = Math.min(100, frog.belly + 22); score += 25;
      puff(f.x, f.y, '#fff7a8', 6);
      return false;
    }
    return true;
  });

  // Enemies
  spawnTimer -= dt;
  if (spawnTimer <= 0) { spawnEnemy(); spawnTimer = Math.max(0.6, 2.6 - time / 30); }

  for (const e of enemies) {
    if (e.type === 'snake') {
      e.life -= dt; e.a += dt * 8;
      const tx = e.life > 0 ? frog.x : (e.x < W / 2 ? -200 : W + 200);
      const ty = e.life > 0 ? frog.y : e.y;
      const ang = Math.atan2(ty - e.y, tx - e.x);
      e.x += Math.cos(ang) * e.speed * dt; e.y += Math.sin(ang) * e.speed * dt;
      e.dir = ang;
      e.trail.unshift({ x: e.x + Math.cos(ang + 1.57) * Math.sin(e.a) * 6, y: e.y + Math.sin(ang + 1.57) * Math.sin(e.a) * 6 });
      if (e.trail.length > 22) e.trail.pop();
      if (Math.hypot(e.x - frog.x, e.y - frog.y) < frog.r + 12) hurt();
      if (e.life < -6) e.dead = true;
    } else if (e.type === 'heron') {
      e.t += dt;
      if (!e.struck && e.t >= e.warn) {
        e.struck = true; shake = 0.15;
        puff(e.x, e.y, '#d8e6f0', 10);
        if (Math.hypot(e.x - frog.x, e.y - frog.y) < 45 + frog.r) hurt();
      }
      if (e.t > e.warn + 0.6) e.dead = true;
    } else if (e.type === 'hawk') {
      e.t += dt;
      if (e.t > e.warn) {
        e.x += Math.cos(e.ang) * e.speed * dt; e.y += Math.sin(e.ang) * e.speed * dt;
        if (Math.hypot(e.x - frog.x, e.y - frog.y) < frog.r + 22) hurt();
        if (e.x < -300 || e.x > W + 300 || e.y < -300 || e.y > H + 300) e.dead = true;
      }
    }
  }
  enemies = enemies.filter(e => !e.dead);

  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
}

// ---------- Drawing ----------
function drawBackground() {
  const g = ctx.createRadialGradient(W / 2, H / 2, 50, W / 2, H / 2, Math.max(W, H));
  g.addColorStop(0, '#3d7a5c'); g.addColorStop(1, '#1e4a3a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (const l of lilies) {
    ctx.fillStyle = '#4f9a3e';
    ctx.beginPath();
    ctx.moveTo(l.x, l.y);
    ctx.arc(l.x, l.y, l.r, l.a, l.a + 5.7);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#3c7d2e'; ctx.lineWidth = 2; ctx.stroke();
  }
}

function drawFrog() {
  const lift = frog.air > 0 ? Math.sin((frog.air / 0.55) * Math.PI) * 25 : Math.abs(Math.sin(frog.hop)) * 3;
  const scale = 1 + lift / 60;
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(frog.x, frog.y + 6, frog.r, frog.r * 0.6, 0, 0, 6.28); ctx.fill();
  if (frog.hurt > 0 && Math.floor(frog.hurt * 10) % 2 === 0) return;

  ctx.save();
  ctx.translate(frog.x, frog.y - lift);
  ctx.rotate(frog.dir + Math.PI / 2);
  ctx.scale(scale, scale);
  // Back legs
  ctx.fillStyle = '#4caf2e';
  ctx.beginPath(); ctx.ellipse(-16, 10, 8, 13, -0.5, 0, 6.28); ctx.fill();
  ctx.beginPath(); ctx.ellipse(16, 10, 8, 13, 0.5, 0, 6.28); ctx.fill();
  // Front legs
  ctx.beginPath(); ctx.ellipse(-13, -8, 5, 8, 0.4, 0, 6.28); ctx.fill();
  ctx.beginPath(); ctx.ellipse(13, -8, 5, 8, -0.4, 0, 6.28); ctx.fill();
  // Body
  ctx.fillStyle = '#6fd13f';
  ctx.beginPath(); ctx.ellipse(0, 0, 16, 19, 0, 0, 6.28); ctx.fill();
  ctx.fillStyle = '#9be35a';
  ctx.beginPath(); ctx.ellipse(0, 3, 9, 11, 0, 0, 6.28); ctx.fill();
  // Eyes
  for (const s of [-1, 1]) {
    ctx.fillStyle = '#6fd13f';
    ctx.beginPath(); ctx.arc(s * 8, -14, 7, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(s * 8, -15, 5, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(s * 8, -16, 2.5, 0, 6.28); ctx.fill();
  }
  ctx.restore();
}

function drawFly(f) {
  const flap = Math.sin(f.t * 40) * 3;
  ctx.fillStyle = 'rgba(220,240,255,0.7)';
  ctx.beginPath(); ctx.ellipse(f.x - 4, f.y - 4, 5, 3 + flap * 0.3, -0.5, 0, 6.28); ctx.fill();
  ctx.beginPath(); ctx.ellipse(f.x + 4, f.y - 4, 5, 3 - flap * 0.3, 0.5, 0, 6.28); ctx.fill();
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(f.x, f.y, 4, 0, 6.28); ctx.fill();
  ctx.fillStyle = '#c33';
  ctx.beginPath(); ctx.arc(f.x + 3, f.y - 1, 1.5, 0, 6.28); ctx.fill();
}

function drawSnake(e) {
  ctx.lineCap = 'round';
  for (let i = e.trail.length - 1; i > 0; i--) {
    const p = e.trail[i], q = e.trail[i - 1];
    ctx.strokeStyle = i % 4 < 2 ? '#c9a227' : '#8a6d12';
    ctx.lineWidth = 14 - i * 0.4;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
  }
  ctx.save();
  ctx.translate(e.x, e.y); ctx.rotate(e.dir);
  ctx.fillStyle = '#a8861a';
  ctx.beginPath(); ctx.ellipse(4, 0, 12, 9, 0, 0, 6.28); ctx.fill();
  ctx.fillStyle = '#ff0';
  ctx.beginPath(); ctx.arc(8, -5, 2.5, 0, 6.28); ctx.arc(8, 5, 2.5, 0, 6.28); ctx.fill();
  if (Math.sin(e.a * 0.7) > 0) {
    ctx.strokeStyle = '#e33'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(15, 0); ctx.lineTo(24, 0); ctx.lineTo(28, -3); ctx.moveTo(24, 0); ctx.lineTo(28, 3); ctx.stroke();
  }
  ctx.restore();
}

function drawHeron(e) {
  const k = Math.min(1, e.t / e.warn);
  if (!e.struck) {
    ctx.fillStyle = `rgba(0,0,0,${0.15 + k * 0.35})`;
    ctx.beginPath(); ctx.ellipse(e.x, e.y, 45 * (0.4 + k * 0.6), 30 * (0.4 + k * 0.6), 0, 0, 6.28); ctx.fill();
    ctx.strokeStyle = `rgba(255,80,80,${k})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(e.x, e.y, 45 + frog.r, 0, 6.28 * k); ctx.stroke();
  } else {
    // Beak stabbing down
    const fade = 1 - (e.t - e.warn) / 0.6;
    ctx.globalAlpha = Math.max(0, fade);
    ctx.fillStyle = '#d8e6f0';
    ctx.beginPath(); ctx.ellipse(e.x, e.y - 30, 26, 18, 0, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#f2a33a';
    ctx.beginPath(); ctx.moveTo(e.x - 6, e.y - 20); ctx.lineTo(e.x + 6, e.y - 20); ctx.lineTo(e.x, e.y + 10); ctx.fill();
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(e.x - 8, e.y - 34, 3, 0, 6.28); ctx.arc(e.x + 8, e.y - 34, 3, 0, 6.28); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function drawHawk(e) {
  if (e.t <= e.warn) {
    // Warning line along the dive path
    const flash = Math.floor(e.t * 8) % 2 === 0;
    ctx.strokeStyle = flash ? 'rgba(255,60,60,0.7)' : 'rgba(255,200,60,0.5)';
    ctx.lineWidth = 6; ctx.setLineDash([20, 15]);
    ctx.beginPath(); ctx.moveTo(e.x, e.y);
    ctx.lineTo(e.x + Math.cos(e.ang) * 3000, e.y + Math.sin(e.ang) * 3000); ctx.stroke();
    ctx.setLineDash([]);
    return;
  }
  ctx.save();
  ctx.translate(e.x, e.y); ctx.rotate(e.ang);
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(-10, 30, 30, 50, 0, 0, 6.28); ctx.fill();
  ctx.fillStyle = '#7a4a26';
  ctx.beginPath(); ctx.moveTo(25, 0); ctx.lineTo(-10, -50); ctx.lineTo(-20, 0); ctx.lineTo(-10, 50); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#a0683a';
  ctx.beginPath(); ctx.ellipse(0, 0, 24, 10, 0, 0, 6.28); ctx.fill();
  ctx.fillStyle = '#f2c23a';
  ctx.beginPath(); ctx.moveTo(24, -4); ctx.lineTo(34, 0); ctx.lineTo(24, 4); ctx.fill();
  ctx.restore();
}

function drawHUD() {
  ctx.font = 'bold 28px Trebuchet MS';
  ctx.textBaseline = 'top';
  ctx.fillStyle = '#ff5a6e';
  ctx.fillText('♥'.repeat(Math.max(0, frog.hearts)) + '♡'.repeat(Math.max(0, 3 - frog.hearts)), 16, 14);
  // Belly bar
  ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(16, 52, 160, 14);
  ctx.fillStyle = frog.belly < 30 ? '#ff7b3a' : '#ffd84a';
  ctx.fillRect(16, 52, 160 * Math.max(0, frog.belly) / 100, 14);
  ctx.fillStyle = '#fff'; ctx.font = '12px Trebuchet MS'; ctx.fillText('BELLY', 20, 53);
  // Leap
  ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(16, 72, 160, 8);
  ctx.fillStyle = '#7fd4ff'; ctx.fillRect(16, 72, 160 * (1 - frog.leapCd / 1.4), 8);

  ctx.textAlign = 'right'; ctx.fillStyle = '#fff'; ctx.font = 'bold 28px Trebuchet MS';
  ctx.fillText(Math.floor(score), W - 16, 14);
  ctx.font = '16px Trebuchet MS';
  ctx.fillText(`${time.toFixed(1)}s  ·  best ${best}`, W - 16, 48);
  ctx.textAlign = 'left';
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * 12, (Math.random() - 0.5) * 12);
  drawBackground();
  for (const e of enemies) if (e.type === 'heron' && !e.struck) drawHeron(e);
  for (const f of flies) drawFly(f);
  for (const e of enemies) if (e.type === 'snake') drawSnake(e);
  drawFrog();
  for (const e of enemies) if (e.type === 'heron' && e.struck) drawHeron(e);
  for (const e of enemies) if (e.type === 'hawk') drawHawk(e);
  for (const p of particles) {
    ctx.globalAlpha = p.life * 2; ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, 6.28); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  if (frog) drawHUD();
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (running) update(dt);
  draw();
  requestAnimationFrame(loop);
}

startBtn.onclick = () => {
  reset();
  running = true;
  overlay.classList.add('hidden');
};

reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
